<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="tabs">
                <button type="button" id="loginTab" class="tab active">Login</button>
                <button type="button" id="registerTab" class="tab">Register</button>
            </div>

            <form id="loginForm">
                <h1>Welcome Back</h1>
                <p class="subtitle">Login to your account</p>

                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>

                <button type="submit" class="submit-button">Login</button>
                <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
                <p class="switch-text">Don't have an account? <a href="#" id="showRegister">Register</a></p>
            </form>

            <form id="registerForm" class="hidden">
                <h1>Create Account</h1>
                <p class="subtitle">Register to get started</p>

                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" placeholder="Enter your full name" required>

                <label for="registerEmail">Email Address</label>
                <input type="email" id="registerEmail" placeholder="Enter your email" required>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="Create a password" minlength="6" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="6" required>

                <button type="submit" class="submit-button">Register</button>
                <p id="registerMessage" class="message" role="status" aria-live="polite"></p>
                <p class="switch-text">Already have an account? <a href="#" id="showLogin">Login</a></p>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
